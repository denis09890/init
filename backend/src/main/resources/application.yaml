# Base configuration shared by all profiles.
# Environment-specific values come from environment variables (see .env.example in the repo root).
spring:
  application:
    name: init
  config:
    # The company catalog (init.catalog.*).
    import: classpath:companies.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:init}
    username: ${DB_USERNAME:init}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

init:
  ingestion:
    # Scheduled ingestion: a fixed delay between the end of one run and the start of the next.
    scheduler-enabled: true
    interval: PT6H
    initial-delay: PT1M
    # Sources fetched at the same time. Keep it below the database pool size (10 by default).
    max-parallel-sources: 4
  http:
    # Politeness towards every host we fetch from.
    max-concurrent-requests-per-host: 2
    min-request-interval: 200ms
    max-attempts: 3
    initial-backoff: 1s
    max-backoff: 30s
