# Company catalog: the companies Init follows and the public sources their postings come from.
# Synchronized into the database at startup: new entries are added, changed ones updated, and
# entries removed from this file are deactivated (never deleted, so posting history is kept).
#
# Rules (see docs/adr/0002-data-sources-and-legal-stance.md):
# - Every identifier must be verified against the live public API before it is added.
# - Never guess board tokens or company ids. Candidates are looked up with
#   scripts/check-ats-sources.ps1, and a person checks that the board really belongs to the company.
# - `example: true` marks the first entries, added as verified examples before the catalog grew.
#
# Source fields: type (GREENHOUSE | LEVER | SMARTRECRUITERS | JSON_LD), identifier (board token,
# company id or career page URL), region (GLOBAL | EU, default GLOBAL; Lever only).
init:
  catalog:
    companies:
      # Verified 2026-11-22: GET https://boards-api.greenhouse.io/v1/boards/scbitdefendersrl/jobs
      - name: Bitdefender
        slug: bitdefender
        website: https://www.bitdefender.com
        example: true
        sources:
          - type: GREENHOUSE
            identifier: scbitdefendersrl

      # Verified 2026-11-22: GET https://boards-api.greenhouse.io/v1/boards/cresta/jobs
      - name: Cresta
        slug: cresta
        website: https://cresta.com
        example: true
        sources:
          - type: GREENHOUSE
            identifier: cresta

      # Verified 2026-11-22: GET https://api.smartrecruiters.com/v1/companies/BoschGroup/postings?country=ro
      - name: Bosch
        slug: bosch
        website: https://www.bosch.com
        example: true
        sources:
          - type: SMARTRECRUITERS
            identifier: BoschGroup

      # Verified 2026-11-28 with scripts/check-ats-sources.ps1: the board name returned by each API is
      # the company's own, and each had postings located in Romania. SmartRecruiters identifiers are
      # case-insensitive (`Endava` and `endava` return the same board).
      - name: Endava
        slug: endava
        website: https://www.endava.com
        sources:
          - type: SMARTRECRUITERS
            identifier: Endava

      - name: Continental
        slug: continental
        website: https://www.continental.com
        sources:
          - type: SMARTRECRUITERS
            identifier: Continental

      - name: Accesa
        slug: accesa
        website: https://www.accesa.eu
        sources:
          - type: SMARTRECRUITERS
            identifier: Accesa

      - name: Gameloft
        slug: gameloft
        website: https://www.gameloft.com
        sources:
          - type: SMARTRECRUITERS
            identifier: Gameloft

      - name: Stripe
        slug: stripe
        website: https://stripe.com
        sources:
          - type: GREENHOUSE
            identifier: stripe

      - name: Elastic
        slug: elastic
        website: https://www.elastic.co
        sources:
          - type: GREENHOUSE
            identifier: elastic

      - name: Hootsuite
        slug: hootsuite
        website: https://www.hootsuite.com
        sources:
          - type: GREENHOUSE
            identifier: hootsuite

      - name: Wolt
        slug: wolt
        website: https://wolt.com
        sources:
          - type: GREENHOUSE
            identifier: wolt

      - name: Showpad
        slug: showpad
        website: https://www.showpad.com
        sources:
          - type: GREENHOUSE
            identifier: showpad
